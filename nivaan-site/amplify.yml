version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - cd nivaan-site
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: nivaan-site/out
    files:
      - '**/*'
  cache:
    paths:
      - nivaan-site/node_modules/**/*
      - nivaan-site/.next/cache/**/*
