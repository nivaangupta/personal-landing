name: Deploy API to Lambda

on:
  push:
    branches: [main, dev]
    paths:
      - "apps/api/**"
      - "packages/database/**"
      - ".github/workflows/deploy-api.yml"
      - "pnpm-lock.yaml"

jobs:
  deploy:
    name: Build & Deploy (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    permissions:
      id-token: write # required for OIDC auth
      contents: read

    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      FUNCTION_NAME: ${{ github.ref_name == 'main' && 'napx-pms-api-production' || 'napx-pms-api-staging' }}
      DEPLOY_BUCKET: aws-sam-cli-managed-default-samclisourcebucket-ctt6tejpe4r2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          pnpm --filter @repo/database run db:generate
          pnpm --filter @repo/database run build
          pnpm --filter api run build

      - name: Package for Lambda
        run: |
          mkdir -p dist-lambda

          # Step 1: Copy compiled dist/ output (includes lambda.js from nest build lambda)
          cp -r apps/api/dist/. dist-lambda/

          # Step 2: Create a package.json with @repo/database resolved to its local
          # compiled path. pnpm deploy has a known bug with node-linker=hoisted that
          # leaves node_modules empty; using npm install with file: refs is reliable.
          #
          # We also pin @prisma/client and @prisma/adapter-pg to the EXACT versions
          # that pnpm resolved in the workspace (stored in node_modules after
          # `pnpm install --frozen-lockfile`). npm install without a lockfile resolves
          # ^7.3.0 to the latest 7.x (e.g. 7.5.0), which is incompatible with the
          # generated client in @repo/database/dist/ that was compiled against 7.3.0.
          # The npm 'overrides' field forces all installs to pin to the workspace version.
          python3 -c "import json,os; ws=os.getcwd(); pv=json.loads(open('node_modules/@prisma/client/package.json').read())['version']; av=json.loads(open('node_modules/@prisma/adapter-pg/package.json').read())['version']; print('Pinning @prisma/client@'+pv+' @prisma/adapter-pg@'+av); p=json.load(open('apps/api/package.json')); p['dependencies']['@repo/database']='file:'+ws+'/packages/database'; p.pop('devDependencies',None); p['overrides']={'@prisma/client':pv,'@prisma/adapter-pg':av}; json.dump(p,open('dist-lambda/package.json','w'),indent=2)"

          # Step 3: Install production dependencies with npm.
          # --omit=dev       skips devDependencies
          # --ignore-scripts skips postinstall hooks (prisma generate already done)
          # --install-links  forces file: deps to be COPIED (not symlinked) so
          #                  @repo/database and its own deps land physically in
          #                  node_modules — symlinks break inside a Lambda zip
          npm install --prefix dist-lambda --omit=dev --ignore-scripts --install-links

          # Step 4: Prune Prisma engine binaries for non-Lambda platforms.
          # Lambda is linux-arm64; all other platform binaries waste space.
          # With @prisma/adapter-pg the native engine isn't used at runtime,
          # but the files are still bundled — remove them to stay under 50MB.
          find dist-lambda/node_modules -type f -name "*.node" \
            ! -name "*linux-arm64*" -delete 2>/dev/null || true
          find dist-lambda/node_modules -type d -name "rhel*" \
            -exec rm -rf {} + 2>/dev/null || true
          find dist-lambda/node_modules -type d -name "darwin*" \
            -exec rm -rf {} + 2>/dev/null || true
          find dist-lambda/node_modules -type d -name "windows*" \
            -exec rm -rf {} + 2>/dev/null || true
          find dist-lambda/node_modules -type d -name "debian*" \
            -exec rm -rf {} + 2>/dev/null || true

          echo "Package size: $(du -sh dist-lambda | cut -f1)"
          echo "node_modules: $(ls dist-lambda/node_modules | wc -l) packages"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Create this role — see infrastructure/github-actions-role.yaml
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Update Lambda environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region us-east-2 \
            --environment "Variables={
              DATABASE_URL=${{ secrets.DATABASE_URL }},
              BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }},
              BETTER_AUTH_URL=${{ vars.BETTER_AUTH_URL }},
              API_URL=${{ vars.API_URL }},
              REDIS_URL=${{ secrets.REDIS_URL }},
              NODE_ENV=production
            }"
          aws lambda wait function-updated \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region us-east-2

      - name: Deploy to Lambda
        run: |
          S3_KEY="lambda/${{ env.FUNCTION_NAME }}/$(date +%Y%m%d-%H%M%S).zip"
          cd dist-lambda && zip -qr "${GITHUB_WORKSPACE}/deploy.zip" . && cd "${GITHUB_WORKSPACE}"
          aws s3 cp deploy.zip "s3://${{ env.DEPLOY_BUCKET }}/${S3_KEY}" --region us-east-2
          aws lambda update-function-code \
            --function-name ${{ env.FUNCTION_NAME }} \
            --s3-bucket ${{ env.DEPLOY_BUCKET }} \
            --s3-key "${S3_KEY}" \
            --region us-east-2
          aws lambda wait function-updated \
            --function-name ${{ env.FUNCTION_NAME }} \
            --region us-east-2
          echo "Deployed zip: ${S3_KEY}"
